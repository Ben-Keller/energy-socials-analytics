<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="group" aria-label="A practical sequence of editorial tests. Use arrow keys to inspect marks, Enter to select and Escape to clear." data-figure-id="f29" font-family="Arial, sans-serif" tabindex="0"><title>A practical sequence of editorial tests</title><desc>Proposed tests rather than measured outcomes. This is a proposed workflow, not a performance forecast. Keep topic, audience and timing as comparable as practical. Review substantive comments as well as counts.</desc><rect width="1000" height="630" fill="#FFFFFF"></rect><text x="30" y="33" font-size="14" fill="#00689D" font-weight="600" text-anchor="start">29  /  EDITORIAL NEXT STEPS</text><text x="30" y="72" font-size="29" fill="#10253F" font-weight="600" text-anchor="start">A practical sequence of editorial tests</text><text x="30" y="100" font-size="17" fill="#485B70" font-weight="400" text-anchor="start">Proposed tests rather than measured outcomes</text><line x1="30" y1="598" x2="970" y2="598" stroke="#D9E2EB" stroke-width="1"></line><text x="30" y="618" font-size="12" fill="#485B70" font-weight="400" text-anchor="start">RIAD MEDDEB  ·  LINKEDIN VISUAL ANALYSIS  ·  02 OCT 2026</text><text x="970" y="618" font-size="12" fill="#485B70" font-weight="400" text-anchor="end">D3 / F29</text><circle cx="57" cy="176" r="17" fill="#00689D" data-detail="Step 1 · Frame one decision · Keep one subject and one practical choice in view." tabindex="-1" role="button" data-focus="Step 1" data-mark-index="0" aria-label="Step 1 · Frame one decision · Keep one subject and one practical choice in view." class="explorable"></circle><text x="57" y="182" font-size="18" fill="white" font-weight="600" text-anchor="middle">1</text><line x1="78" y1="176" x2="263" y2="176" stroke="#D9E2EB" stroke-width="2"></line><text x="40" y="228" font-size="22" fill="#10253F" font-weight="600" text-anchor="start"><tspan x="40" dy="0">Frame one decision</tspan></text><text x="40" y="298" font-size="20" fill="#485B70" font-weight="400" text-anchor="start"><tspan x="40" dy="0">Keep one subject and</tspan><tspan x="40" dy="25">one practical choice</tspan><tspan x="40" dy="25">in view.</tspan></text><circle cx="297" cy="176" r="17" fill="#00689D" data-detail="Step 2 · Vary one element · Compare a visual, opening or writing approach." tabindex="-1" role="button" data-focus="Step 2" data-mark-index="1" aria-label="Step 2 · Vary one element · Compare a visual, opening or writing approach." class="explorable"></circle><text x="297" y="182" font-size="18" fill="white" font-weight="600" text-anchor="middle">2</text><line x1="318" y1="176" x2="503" y2="176" stroke="#D9E2EB" stroke-width="2"></line><text x="280" y="228" font-size="22" fill="#10253F" font-weight="600" text-anchor="start"><tspan x="280" dy="0">Vary one element</tspan></text><text x="280" y="298" font-size="20" fill="#485B70" font-weight="400" text-anchor="start"><tspan x="280" dy="0">Compare a visual,</tspan><tspan x="280" dy="25">opening or writing</tspan><tspan x="280" dy="25">approach.</tspan></text><circle cx="537" cy="176" r="17" fill="#00689D" data-detail="Step 3 · Observe at the same age · Record 7 day metrics where analytics are available." tabindex="-1" role="button" data-focus="Step 3" data-mark-index="2" aria-label="Step 3 · Observe at the same age · Record 7 day metrics where analytics are available." class="explorable"></circle><text x="537" y="182" font-size="18" fill="white" font-weight="600" text-anchor="middle">3</text><line x1="558" y1="176" x2="743" y2="176" stroke="#D9E2EB" stroke-width="2"></line><text x="520" y="228" font-size="22" fill="#10253F" font-weight="600" text-anchor="start"><tspan x="520" dy="0">Observe at the same</tspan><tspan x="520" dy="27.5">age</tspan></text><text x="520" y="298" font-size="20" fill="#485B70" font-weight="400" text-anchor="start"><tspan x="520" dy="0">Record 7 day metrics</tspan><tspan x="520" dy="25">where analytics are</tspan><tspan x="520" dy="25">available.</tspan></text><circle cx="777" cy="176" r="17" fill="#00689D" data-detail="Step 4 · Read the conversation · Separate substantive replies from congratulations." tabindex="-1" role="button" data-focus="Step 4" data-mark-index="3" aria-label="Step 4 · Read the conversation · Separate substantive replies from congratulations." class="explorable"></circle><text x="777" y="182" font-size="18" fill="white" font-weight="600" text-anchor="middle">4</text><text x="760" y="228" font-size="22" fill="#10253F" font-weight="600" text-anchor="start"><tspan x="760" dy="0">Read the</tspan><tspan x="760" dy="27.5">conversation</tspan></text><text x="760" y="298" font-size="20" fill="#485B70" font-weight="400" text-anchor="start"><tspan x="760" dy="0">Separate substantive</tspan><tspan x="760" dy="25">replies from</tspan><tspan x="760" dy="25">congratulations.</tspan></text><line x1="40" y1="405" x2="960" y2="405" stroke="#D9E2EB" stroke-width="1"></line><text x="40" y="447" font-size="23" fill="#10253F" font-weight="600" text-anchor="start">Three useful starting comparisons</text><text x="40" y="490" font-size="19" fill="#00689D" font-weight="600" text-anchor="start">Argument</text><text x="40" y="523" font-size="20" fill="#10253F" font-weight="400" text-anchor="start"><tspan x="40" dy="0">One finding with a chart</tspan></text><text x="355" y="490" font-size="19" fill="#00689D" font-weight="600" text-anchor="start">Event</text><text x="355" y="523" font-size="20" fill="#10253F" font-weight="400" text-anchor="start"><tspan x="355" dy="0">A decision from the room</tspan></text><text x="670" y="490" font-size="19" fill="#00689D" font-weight="600" text-anchor="start">Participation</text><text x="670" y="523" font-size="20" fill="#10253F" font-weight="400" text-anchor="start"><tspan x="670" dy="0">A specific professional</tspan><tspan x="670" dy="25">question</tspan></text></svg>